<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Details | AURA ESTATES</title>
  <link rel="stylesheet" href="styles.css"><script src="script.js" defer></script>
</head>
<body>
<header class="navbar">
  <a href="index.html" class="logo">AURA <span>ESTATES</span></a>
  <button class="menu-btn" id="menuBtn" aria-label="Open navigation menu">☰</button>
  <nav id="navMenu"><a href="index.html">Home</a><a href="properties.html" class="active">Properties</a><a href="about.html">About</a><a href="services.html">Services</a><a href="contact.html">Contact</a></nav>
</header>
<main>
  <section class="property-detail-hero" id="propertyHeroImage">
    <div class="property-detail-overlay">
      <p class="eyebrow" id="propertyType">PROPERTY DETAILS</p>
      <h1 id="propertyName">Property Details</h1>
      <p id="propertyDescription">Loading…</p>
    </div>
  </section>
  <section class="property-detail-section">
    <div class="property-main-content">
      <p class="eyebrow">PROPERTY OVERVIEW</p>
      <h2>Designed For<br><span>Exceptional Living.</span></h2>
      <p class="detail-description" id="propertyOverview"></p>
    </div>
    <aside class="property-spec-card">
      <div class="price" id="propertyPrice"></div>
      <p class="price-note">Property price</p>
      <div class="spec-row"><span>Bedrooms</span><strong id="propertyBeds"></strong></div>
      <div class="spec-row"><span>Bathrooms</span><strong id="propertyBaths"></strong></div>
      <div class="spec-row"><span>Area</span><strong id="propertyArea"></strong></div>
      <div class="spec-row"><span>Property Type</span><strong id="propertyTypeValue"></strong></div>
      <a id="propertyEnquire" href="contact.html" class="glass-btn primary-btn detail-contact-btn">Enquire About This Property →</a>
    </aside>
  </section>
</main>
<footer><div class="logo">AURA <span>ESTATES</span></div><p>© 2026 AURA ESTATES. All rights reserved. · <a href="admin.html">Admin</a></p></footer>
